name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --production
      - name: Despliegue simulado
        run: |
          echo "SIMULACIÓN: se desplegaría ${GITHUB_SHA::7} en https://tienda.ceramica-demo.example"
          echo "SIMULACIÓN: se ejecutaría 'bun run db:seed' solo si el catálogo estuviera vacío"
          echo "SIMULACIÓN: no se usa ningún secreto ni cuenta externa"
